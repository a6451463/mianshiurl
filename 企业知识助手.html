<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个用于测试 Dify Workflow 的原生网页">
  <title>Dify 企业内部知识助手</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: rgba(255, 255, 255, 0.92);
      --text: #172033;
      --muted: #657086;
      --line: #dce3ef;
      --primary: #3568e8;
      --primary-hover: #2857cb;
      --danger: #bd2c3b;
      --warning-bg: #fff8e6;
      --warning-border: #f0d58a;
      --shadow: 0 24px 70px rgba(35, 55, 95, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(circle at 15% 12%, rgba(53, 104, 232, 0.13), transparent 30%),
        radial-gradient(circle at 88% 90%, rgba(75, 190, 160, 0.12), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(220, 227, 239, 0.9);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 590px;
      margin: 14px 0 30px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 142px;
      resize: vertical;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: var(--text);
      font: inherit;
      line-height: 1.6;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(53, 104, 232, 0.12);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
    }

    button {
      min-width: 124px;
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--primary-hover);
    }

    button:disabled { cursor: wait; opacity: 0.65; }

    #status {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    #status.loading::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid #b8c4df;
      border-top-color: var(--primary);
      border-radius: 50%;
      vertical-align: -2px;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result-wrap {
      margin-top: 28px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .result-wrap h2 { margin: 0 0 12px; font-size: 18px; }

    #result {
      min-height: 110px;
      margin: 0;
      padding: 18px;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f9fbfe;
      color: #2a354c;
      font-size: 15px;
      line-height: 1.85;
    }

    #result.error { border-color: #efb3ba; background: #fff6f7; color: var(--danger); }
    #result > :first-child { margin-top: 0; }
    #result > :last-child { margin-bottom: 0; }
    #result p { margin: 0 0 13px; }
    #result h3 { margin: 22px 0 10px; color: #172033; font-size: 17px; line-height: 1.45; }
    #result strong { color: #172033; font-weight: 750; }
    #result ol, #result ul { margin: 8px 0 15px; padding-left: 1.55em; }
    #result li { padding-left: 4px; margin: 6px 0; }
    #result li::marker { color: var(--primary); font-weight: 700; }

    details {
      margin-top: 24px;
      border: 1px solid var(--warning-border);
      border-radius: 12px;
      background: var(--warning-bg);
      color: #6b561b;
    }

    summary { padding: 13px 15px; cursor: pointer; font-weight: 700; }
    details p { margin: 0; padding: 0 15px 15px; font-size: 13px; line-height: 1.65; }

    @media (max-width: 560px) {
      body { padding: 18px 12px; }
      main { border-radius: 18px; }
      .actions { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>企业内部知识助手</h1>
    <p class="intro">请输入问题，我会根据公司最新知识给你提供参考</p>

    <form id="questionForm">
      <label for="question">你的问题</label>
      <textarea id="question" placeholder="例如：公司的年假制度是什么？" required></textarea>
      <div class="actions">
        <button id="submitButton" type="submit">提交问题</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>
        <p class="eyebrow">这个项目仅作为我的项目成果与简历作品展示，旨在演示基于大模型与知识库的智能问答流程，不面向公众提供商业服务。
      使用者应遵守中华人民共和国现行法律法规及相关平台规则，不得利用本项目制作、复制、发布、传播违法违规或有害信息，不得侵害他人合法权益。
      项目所涉内容仅作技术演示，不构成任何专业意见或承诺。特此划清界限</p>
    <section class="result-wrap" aria-labelledby="resultTitle">
      <h2 id="resultTitle">回答结果</h2>
      <div id="result" aria-live="polite">等待提问……</div>
    </section>

    <details>
      <summary>测试版安全提示</summary>
      <p>请勿传播</p>
    </details>
  </main>

  <script>
    // ===== apio =====
    const DIFY_API_KEY = "app-hsfOjevoBOKZiTgWQ4un6syJ"; // api
    const INPUT_VARIABLE_NAME = "Enter_Text"; // 写开始节点的变量
    // ===========================

    const API_URL = "https://api.dify.ai/v1/workflows/run";
    const form = document.getElementById("questionForm");
    const questionInput = document.getElementById("question");
    const submitButton = document.getElementById("submitButton");
    const statusElement = document.getElementById("status");
    const resultElement = document.getElementById("result");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatInline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    function renderMarkdown(text) {
      const lines = String(text).replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let listType = null;

      function closeList() {
        if (listType) html.push(`</${listType}>`);
        listType = null;
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        const heading = line.match(/^#{1,3}\s+(.+)$/);
        const ordered = line.match(/^\d+[.)]\s+(.+)$/);
        const bullet = line.match(/^[-*+]\s+(.+)$/);

        if (!line) {
          closeList();
        } else if (heading) {
          closeList();
          html.push(`<h3>${formatInline(heading[1])}</h3>`);
        } else if (ordered || bullet) {
          const nextType = ordered ? "ol" : "ul";
          if (listType !== nextType) {
            closeList();
            listType = nextType;
            html.push(`<${listType}>`);
          }
          html.push(`<li>${formatInline((ordered || bullet)[1])}</li>`);
        } else {
          closeList();
          html.push(`<p>${formatInline(line)}</p>`);
        }
      }
      closeList();
      return html.join("") || "<p>Workflow 没有返回可展示的内容。</p>";
    }

    function showResult(content, isError = false) {
      if (isError) {
        resultElement.textContent = content;
      } else {
        resultElement.innerHTML = renderMarkdown(content);
      }
      resultElement.classList.toggle("error", isError);
    }

    function formatOutputs(outputs) {
      if (outputs === null || outputs === undefined) return "Workflow 已完成，但没有返回 outputs。";
      if (typeof outputs === "string") return outputs;

      const values = Object.values(outputs);
      if (values.length === 1 && typeof values[0] === "string") return values[0];
      return JSON.stringify(outputs, null, 2);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = questionInput.value.trim();
      if (!question) {
        showResult("请先输入问题。", true);
        questionInput.focus();
        return;
      }

      if (!DIFY_API_KEY || DIFY_API_KEY.includes("在这里填写")) {
        showResult("请先在 HTML 文件的配置区填写 DIFY_API_KEY。", true);
        return;
      }

      if (!INPUT_VARIABLE_NAME) {
        showResult("请填写 Workflow 的实际输入变量名。", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "提交中…";
      statusElement.textContent = "正在运行 Workflow";
      statusElement.className = "loading";
      showResult("用的是国产便宜模型，有点慢，等待下马上好 Dify 返回结果……");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${DIFY_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            inputs: { [INPUT_VARIABLE_NAME]: question },
            response_mode: "blocking",
            user: `web-test-${crypto.randomUUID ? crypto.randomUUID() : Date.now()}`
          })
        });

        const rawText = await response.text();
        let data;
        try {
          data = rawText ? JSON.parse(rawText) : {};
        } catch {
          data = { message: rawText || "服务器返回了无法解析的内容。" };
        }

        if (!response.ok) {
          const message = data.message || data.error || `请求失败（HTTP ${response.status}）`;
          throw new Error(message);
        }

        showResult(formatOutputs(data.data?.outputs));
        statusElement.textContent = "运行完成";
        statusElement.className = "";
      } catch (error) {
        const hint = error instanceof TypeError
          ? "无法连接 Dify。请检查网络、浏览器跨域限制和 API 配置。"
          : error.message;
        showResult(`调用失败：${hint}`, true);
        statusElement.textContent = "运行失败";
        statusElement.className = "";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "提交问题";
      }
    });
  </script>
</body>
</html>
